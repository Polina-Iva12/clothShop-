<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>FashionShop</h1>
    <p>Магазин одежды</p>
</header>

<main>
    <h2>Наши товары</h2>

    <div class="product">
        <div class="product-image">👕</div>

        <h3>Футболка</h3>
        <p>Хлопковая футболка, удобная и стильная</p>
        <p class="price">1500 ₽</p>

        <button id="buy">Купить</button>
        <button id="details">Подробнее</button>
        <button id="delivery">Доставка</button>
        <button id="clear">Очистить</button>

        <p id="message"></p>
        <p id="info"></p>
        <p id="delivery-info"></p>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
